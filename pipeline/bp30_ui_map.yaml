# Карта полного интерфейса «Такси» «1С:Бухгалтерия предприятия», редакция 3.0.
# Это не выгрузка конфигурации: пути сверены с открытыми материалами 1С и со снимком
# панели «Справочники» учебной базы. Где формулировка в релизах расходится, стоит confidence: medium или low.
#
# Главные источники:
# - https://its.1c.ru/db/content/updinfoarch/src/accounting/3.0.104/index.htm
#   полный интерфейс: «Справочники - Товары и услуги - Номенклатура»
# - https://its.1c.ru/db/content/updinfo/src/accounting/3.0.203.24/index.html
#   полный интерфейс: «Покупки - Внешняя торговля - Документы о предстоящей поставке товаров (ДОПП)»
#   и «Покупки - Внешняя торговля - Заявления о ввозе товаров»
#   «Операции - Закрытие периода - Отражение ДОПП в декларации»
# - https://its.1c.ru/db/content/updinfo/src/accounting/3.0.201/index.html
#   вариант пути 3.0.201: «Покупки - Покупки - Внешняя торговля - ...»
# - https://its.1c.ru/db/content/spot/src/5101002%20п_спот.htm
#   раздел Покупки, подраздел Внешняя торговля, документ «Документ о предстоящей поставке товаров»
# - https://buh.ru/articles/posledovatelnost-provedeniya-dokumentov-pri-vvoze-tovarov-iz-eaes-v-programme-1s-bukhgalteriya-8.html
# - https://v8.1c.ru/buhv8/
# Снимок панели «Справочники» учебной базы подтверждает группы «Покупки и продажи» и «Товары и услуги».

