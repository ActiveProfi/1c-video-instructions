- id: '5'
  title: Покупки → Внешняя торговля → ГТД по импорту → Создать (или Поступление → «Создать на основании»
    → «ГТД по импорту»)
  narration: 'Теперь ключевой документ — «ГТД по импорту». На закладке «Главное» выбираем таможню и вводим
    номер декларации — у нас учебный. Таможенный сбор указываем здесь, отдельно: 73 860 рублей. Почему
    так много при таможенной стоимости всего 170 000? Смартфоны с кодом 8517 13 000 0 входят в перечень
    товаров радиоэлектроники — приложение № 1 к постановлению Правительства № 1637. По пункту 4 этого
    постановления, если в декларации есть хотя бы один такой товар, сбор — фиксированные 73 860 рублей,
    независимо от стоимости. Для обычного товара с такой стоимостью было бы 1 231 рубль по пункту 1. Запомните:
    сбор идет в себестоимость товара, но в базу НДС не входит.'
  legal_note: 'Таможенные сборы не включаются в налоговую базу НДС при ввозе (п. 1 ст. 160 НК РФ — база
    = таможенная стоимость + таможенная пошлина + акциз). Ставка сбора: абз. 1 п. 4 ПП РФ от 28.11.2024
    № 1637 (в ред. ПП РФ от 23.10.2025 № 1638) — 73 860 руб., если в ДТ заявлен хотя бы один товар из
    приложения № 1 (8517 13 000 0 — смартфоны); иначе — п. 1 (до 200 000 руб. — 1 231 руб.). Сбор включается
    в себестоимость (ФСБУ 5/2019, п. 11).'
