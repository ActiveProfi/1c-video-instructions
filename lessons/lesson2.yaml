  narration: 'Проводим. Пошлина и сбор ушли в себестоимость, на 41.01. НДС — на 19.05, «НДС, уплаченный
    при ввозе товаров». К вычету мы его примем в следующем уроке. Себестоимость смартфонов теперь 252
    360 рублей: 120 000 товар, 50 000 доставка, 8 500 пошлина и 73 860 сбор по пункту 4 постановления
    № 1637. Не путайте ее с базой НДС, которая 178 500.'
