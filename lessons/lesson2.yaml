lesson: 2
title: 'Урок 2: Импорт из Китая через таможню — ГТД по импорту, таможенная стоимость, пошлина, НДС 22%
  и курсовые разницы'
card_title: 'Урок 2: Импорт из Китая через таможню — ГТД по импорту, таможенная стоимость, пошлина, НДС
  22% и курсовые разницы'
configuration: Бухгалтерия предприятия, редакция 3.0
interface: Такси
organization: Альфа ООО
software: 1С:Бухгалтерия предприятия, ред. 3.0 (Такси), релиз не ниже 3.0.203.24
goal: 'Научиться отражать в 1С:Бухгалтерии 3.0 импорт из страны вне ЕАЭС: поступление товаров в валюте,
  включение доставки до границы в таможенную стоимость, документ «ГТД по импорту» с пошлиной, сбором и
  НДС 22%, переоценку валютного долга при закрытии месяца и оплату поставщику.'
intro_narration: 'Научиться отражать в 1С:Бухгалтерии 3.0 импорт из страны вне ЕАЭС: поступление товаров
  в валюте, включение доставки до границы в таможенную стоимость, документ «ГТД по импорту» с пошлиной,
  сбором и НДС 22%, переоценку валютного долга при закрытии месяца и оплату поставщику. Программа — 1С:Бухгалтерия
  предприятия, ред. 3.0 (Такси), релиз не ниже 3.0.203.24. Организация — Альфа ООО (учебная база).'
outro_narration: 'Товары ввезены, налоги посчитаны. Осталось самое ответственное — закрыть период: принять
  НДС к вычету, заполнить новую декларацию по косвенным налогам с разделом 4 и проверить регистры по налогу
  на прибыль. Это урок 3.'
recording_rules:
- Запись ведется только в учебной (тестовой) базе, организация «Альфа ООО». Все контрагенты, номера документов,
  госномера автомобилей, номера ДОПП и ДТ — условные учебные.
- Курсы валют в примерах — учебные (условные), не официальные курсы ЦБ РФ на эти даты. На экране в кадре
  с курсом показываем плашку «Учебный курс».
- Кнопки «Отправить», «Отправка», «Выгрузить» в ФНС/банк в кадре только ПОКАЗЫВАЕМ (стрелка), но НЕ нажимаем.
  Реальных отправок в ФНС, ФТС и банк нет. QR-код в кадре — макет с надписью «УЧЕБНЫЙ ОБРАЗЕЦ».
- 'Требуемый релиз: 1С:Бухгалтерия 8, ред. 3.0 не ниже 3.0.203.24 (полная поддержка учета по СПОТ и раздела
  4 декларации по косвенным налогам). Документ ДОПП и уплата ОП появились в 3.0.198.19.'
- 'Меню указаны для полного интерфейса «Такси» (разделы слева: Главное, Руководителю, Банк и касса, Продажи,
  Покупки, Склад, Производство, ОС и НМА, Зарплата и кадры, Операции, Отчеты, Справочники, Администрирование).'
- Ставка НДС 22% — с 01.01.2026 (Федеральный закон от 28.11.2025 № 425-ФЗ; п. 3 ст. 164 НК РФ; при импорте
  — п. 5 ст. 164 НК РФ, для ЕАЭС — п. 17 Протокола, прил. № 18 к Договору о ЕАЭС).
training_data:
- 'Поставщик: Shenzhen Digital Co., Ltd. (Китай), контракт в CNY, условия EXW; товар — смартфоны «Z-Phone».
  СПОТ на ввоз из стран вне ЕАЭС не распространяется.'
- 20.06.2026 — выпуск ДТ и принятие к учету; инвойс 10 000 CNY, учебный курс 12,00 → 120 000 руб.
- Доставка до границы — Asia Cargo, 50 000 руб. → таможенная стоимость 170 000 руб.
- 'Пошлина 5% × 170 000 = 8 500 руб.; таможенный сбор — 73 860 руб. (абз. 1 п. 4 ПП РФ от 28.11.2024 №
  1637 (в ред. ПП РФ от 23.10.2025 № 1638): смартфоны 8517 13 000 0 — товар радиоэлектроники из приложения
  № 1).'
- База ввозного НДС = 170 000 + 8 500 = 178 500 руб. (сбор не включается); НДС 22% = 39 270 руб. (в исходнике
  ошибочно 181 500 / 39 930).
- Себестоимость смартфонов в БУ = 120 000 + 50 000 + 8 500 + 73 860 = 252 360 руб.
- '30.06.2026 — учебный курс 12,50: переоценка долга 10 000 CNY → отрицательная курсовая разница 5 000
  руб.'
- 10.07.2026 — оплата 10 000 CNY, учебный курс 12,20 → положительная курсовая разница 3 000 руб.; комиссия
  банка 4 000 руб.
summary:
- 'Импорт из страны вне ЕАЭС: НДС, пошлина и сбор — таможне; документ «ГТД по импорту», расчеты на 76.09.'
- 'При EXW доставка до границы (50 000 руб.) увеличивает таможенную стоимость: 170 000 руб. — вводим вручную
  на закладке «Разделы ДТ».'
- База НДС = таможенная стоимость + пошлина = 178 500 руб.; НДС 22% = 39 270 руб. Сбор в базу НДС не входит.
- Таможенный сбор за смартфоны (8517 13 000 0) — 73 860 руб. по абз. 1 п. 4 ПП РФ № 1637 (радиоэлектроника,
  приложение № 1). Себестоимость в БУ = 252 360 руб. (товар + доставка + пошлина + сбор).
- Долг в валюте переоцениваем при закрытии месяца (−5 000 на 30.06) и при оплате (+3 000 на 10.07).
open_questions:
- Код ТН ВЭД компрессоров и смартфонов в учебных данных не задан — не придумываем, берем из карточки номенклатуры
  учебной базы (или пишем «код ТН ВЭД — учебный»).
- 'Таможенный сбор (урок 2) заменен на нормативный: 73 860 руб. по абз. 1 п. 4 ПП РФ от 28.11.2024 № 1637
  (в ред. ПП РФ от 23.10.2025 № 1638) — смартфоны, код ТН ВЭД ЕАЭС 8517 13 000 0, включены в приложение
  № 1 (товары радиоэлектроники). Допущение: смартфоны «Z-Phone» в учебной базе классифицируются кодом
  8517 13 000 0 (по сноске к приложению № 1 товары определяются исключительно кодами ТН ВЭД). Если в карточке
  номенклатуры будет иной код, не входящий в приложение № 1, применяется абз. 2 п. 1 (таможенная стоимость
  до 200 000 руб. — 1 231 руб.), и себестоимость составит 179 731 руб.'
- Оговорка в абз. 1 п. 4 ПП № 1637 «за исключением товаров радиоэлектроники, не облагаемых вывозными таможенными
  пошлинами» буквально читается неоднозначно; по разъяснению ФТС России (в пересказе payhd.ru, первоисточник
  ФТС не открыт) ставка 73 860 руб. применяется «вне зависимости от направления перемещения», а оговорка
  касается вывоза. В сценарии применяем 73 860 руб. к ввозу; рекомендуется сверить с официальным разъяснением
  ФТС.
- 'Редакция ПП № 1637: текст сверен по Контур.Норматив (ред. ПП от 23.10.2025 № 1638, ставки с 01.01.2026);
  КонсультантПлюс обозначает редакцию датой 27.11.2025 — содержательных изменений п. 1 и п. 4 после ПП
  № 1638 не обнаружено. В запросе дата постановления указана как 28.11.2017 — верная дата: 28.11.2024
  (в силу с 01.01.2025).'
- 'Номер строки раздела 1 новой декларации по косвенным налогам, в которой отражается сумма к доплате
  (разница НДС и ОП), в источниках не найден: подтверждены только стр. 030 (налог исчисленный), стр. 031
  (налог без ДОПП) и стр. 060 (ОП в части исполнения обязанности по НДС). В ролике показываем строку по
  факту автозаполнения в 1С, номер не озвучиваем.'
- Проводка разницы между начисленным НДС и ОП при регламентной операции «Отражение ДОПП в декларации»
  (предположительно Дт 68.42 — Кт 68.90) по источникам 1С не подтверждена дословно — в кадре показываем
  фактическую проводку из «Результата проведения». При подключенном 1С:ЕНС проводки по ЕНС не формируются,
  а загружаются из ЛК ФНС.
- 'Срок и порядок подтверждения уплаты ввозного НДС для вычета (документ «Подтверждение оплаты НДС в бюджет»)
  при исполнении обязанности за счет ОП в СПОТ: разъяснений о моменте, когда НДС считается уплаченным
  для вычета, не найдено. В уроке 3 вычет по компрессорам показан как шаг «после подтверждения уплаты
  и отметки ФНС на заявлении», без даты.'
- 'Строки декларации по НДС (разд. 3: стр. 150 — таможенный ввоз, стр. 160 — ЕАЭС) и декларации по налогу
  на прибыль (Лист 02 стр. 040; Приложение 2 к Листу 02 стр. 200) указаны по известной структуре форм;
  перед записью сверить с формой, действующей за 2/3 квартал 2026 г. в релизе учебной базы.'
- 'Точные названия некоторых элементов 1С зависят от релиза: вид операции «Комиссия банка» (в части релизов
  — «Прочее списание»), закладка функциональности «Торговля»/«Внешняя торговля», путь к «Поступлению доп.
  расходов» и к «Отчетности по НДС». Перед записью сверить в учебной базе.'
- 'Нормы ТК ЕАЭС: включение расходов по доставке до места прибытия в таможенную стоимость — пп. 4 п. 1
  ст. 40 ТК ЕАЭС (проверено по общей норме); пункт ТК ЕАЭС о курсе пересчета на день регистрации ДТ в
  сценарии не цитируется номером.'
- 'Учебные даты: выпуск ДТ 20.06.2026 приходится на субботу (оставлено из исходника, таможня может работать;
  при желании перенести на 19.06).'
- ПБУ 3/2006 и ФСБУ 5/2019 цитируются как действующие в 2026 г.; отдельной проверки на изменения в 2026
  г. не проводилось.
