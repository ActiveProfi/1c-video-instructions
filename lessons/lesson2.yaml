- id: '6'
  title: ГТД по импорту → закладка «Разделы ДТ»
  narration: 'Закладка «Разделы ДТ». Программа предлагает таможенную стоимость по инвойсу — 120 000. Вручную
    увеличиваем ее до 170 000: добавляем доставку до границы. Пошлина 5% — 8 500. А НДС считаем от таможенной
    стоимости плюс пошлина: 178 500 умножить на 22% — 39 270 рублей. Нажимаем «Распределить», чтобы суммы
    легли на товары.'
  legal_note: 'База НДС при ввозе = таможенная стоимость + пошлина (+ акциз) (п. 1 ст. 160 НК РФ); ставка
    22% (пп. 3, 5 ст. 164 НК РФ). Доставка до границы — в таможенной стоимости (пп. 4 п. 1 ст. 40 ТК ЕАЭС).
    Исправление: в исходнике в базу НДС ошибочно включен сбор (181 500 / 39 930).'
  menu_path: ГТД по импорту → закладка «Разделы ДТ»
  ui_element: 'Поля раздела: «Таможенная стоимость», «Ставка пошлины», «Сумма пошлины», «Ставка НДС»,
