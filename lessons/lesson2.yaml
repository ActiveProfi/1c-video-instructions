- id: '8'
  title: Операции → Закрытие месяца → июнь 2026 → «Выполнить закрытие месяца» → операция «Переоценка валютных
    средств» → «Справка-расчет»
  narration: 'Конец июня, конец квартала. Долг поставщику в юанях — денежное обязательство, его нужно
    переоценить. Закрываем июнь: в составе закрытия месяца 1С выполняет переоценку валютных средств. Курс
    вырос до 12,50 — долг теперь 125 000, и мы получили отрицательную курсовую разницу 5 000 рублей. В
    налоговом учете — внереализационный расход.'
  legal_note: Обязательства в валюте пересчитываются на отчетную дату (ПБУ 3/2006, п. 7). В НУ отрицательная
    курсовая разница — внереализационный расход (пп. 5 п. 1 ст. 265 НК РФ), признается на последнее число
    месяца (пп. 7 п. 7 ст. 272 НК РФ).
