scenes:
- id: '1'
  title: Справочники → Контрагенты
  narration: 'Во втором уроке поставщик из Китая — это уже не ЕАЭС. Значит, ни СПОТ, ни заявления о ввозе:
    НДС, пошлину и сбор платим таможне по декларации на товары. Посмотрим на справочники и на карточку
    товара: код ТН ВЭД смартфонов — 8517 13 000 0, он нам понадобится для таможенного сбора. Поставщик
    в юанях, перевозчик и таможня — отдельным контрагентом, расчеты с ней пойдут по счету 76.09.'
  legal_note: При ввозе товаров в таможенной процедуре выпуска для внутреннего потребления НДС уплачивается
    таможне (ст. 160 НК РФ; ТК ЕАЭС). Закон № 101-ФЗ касается только ввоза из государств — членов ЕАЭС.
    Ставка таможенного сбора зависит от кода ТН ВЭД (приложение № 1 к ПП РФ от 28.11.2024 № 1637 (в ред.
