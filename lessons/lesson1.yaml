- id: '16'
  title: Заявление о ввозе → «Печать» / кнопки «Выгрузить», «Отправка»
  narration: Заявление о ввозе по-прежнему обязательно и в СПОТ. В рабочей базе его отправляют в ФНС вместе
    с декларацией по косвенным налогам через 1С-Отчетность. Срок — не позднее 20 числа месяца, следующего
    за месяцем принятия товаров к учету, то есть до 20 августа.
  legal_note: Декларация и заявление о ввозе представляются не позднее 20-го числа месяца, следующего
    за месяцем принятия на учет (п. 20 Протокола, прил. № 18).
