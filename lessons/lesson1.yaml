- id: '17'
  title: Операции → Закрытие периода → Отражение ДОПП в декларации → Создать
  narration: 'После заявления проводим регламентную операцию «Отражение ДОПП в декларации». 1С сравнивает
    начисленный НДС с зарезервированным ОП и разницу относит на единый налоговый счет. В нашем примере
    это 8 800 рублей при варианте А или 2 200 при варианте Б — повторю, сумма зависит от условий контракта
    по доставке. Срок уплаты ввозного НДС — не позднее 20 августа. Дата «28 августа» здесь не применяется:
    для импорта из ЕАЭС срок установлен Протоколом к Договору о ЕАЭС.'
  legal_note: Косвенные налоги уплачиваются не позднее 20-го числа месяца, следующего за месяцем принятия
    на учет (п. 19 Протокола, прил. № 18) — для июльского ввоза 20.08.2026 (комментарий проверки №2).
    Сумма к доплате = налог исчисленный − ОП, учтенный в ДОПП (УФНС по Респ. Калмыкия, 05.10.2026; письмо
    ФНС № ЕА-36-15/8583@). Переплата ОП учитывается на ЕНС после камеральной проверки.
  menu_path: Операции → Закрытие периода → Отражение ДОПП в декларации → Создать
  ui_element: 'Регламентная операция «Отражение ДОПП в декларации»: период, кнопка «Заполнить», «Провести»;
    Операции → Закрытие месяца → Справки-расчеты → «Начисление налогов на единый налоговый счет»'
