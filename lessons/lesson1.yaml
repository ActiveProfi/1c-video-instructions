  narration: В мае мы перечислили поставщику 100% аванс — 10 000 долларов. Обратите внимание на счет 60.22
    — это авансы, выданные в валюте. Аванс — неденежная статья, он не переоценивается, и именно по курсу
    аванса товар потом попадет в себестоимость.
  legal_note: Выданный аванс в валюте не переоценивается; при 100% предоплате активы учитываются по курсу
