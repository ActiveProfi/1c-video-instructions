- id: '15'
  title: 'Поступление → «Создать на основании» → «Заявление о ввозе товаров» (список: Покупки → Внешняя
    торговля → Заявления о ввозе товаров)'
  narration: 'На основании поступления создаем заявление о ввозе. Здесь курс уже другой — на дату принятия
    товаров к учету, у нас учебный 93 рубля. 10 000 долларов — это 930 000 рублей. Если контракт подтверждает,
    что доставка входит в стоимость товаров, база — 960 000, а НДС 211 200. Если нет — база 930 000 и
    НДС 204 600 рублей. До проверки контракта окончательную сумму не фиксируем. Проводим: Дебет 19.10
    Кредит 68.42 — начислен ввозной НДС.'
  legal_note: 'Валютная стоимость пересчитывается по курсу ЦБ РФ на дату принятия товаров к учету (п.
    14 Протокола); налог — по ставкам РФ (п. 17 Протокола; ст. 164 НК РФ). Разница с ДОПП нормальна: для
    ОП — курс на день, предшествующий регистрации ДОПП (its.1c.ru, 3.0.203.24).'
  menu_path: 'Поступление → «Создать на основании» → «Заявление о ввозе товаров» (список: Покупки → Внешняя
