    появились в версии 3.0.198.19, а полный учет НДС по СПОТ и новая декларация — с 3.0.203.24. Если у
    вас версия ниже — сначала обновитесь, иначе нужных документов в меню просто не будет.
  legal_note: С 01.06.2026 к ввозу из ЕАЭС автотранспортом применяется Закон от 17.04.2026 № 101-ФЗ (СПОТ).
