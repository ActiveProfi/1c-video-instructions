- id: '3'
  title: Справочники → Контрагенты → ТОО «КазахСтанМаш»
  narration: 'Откроем поставщика. Страна регистрации — Казахстан, член ЕАЭС, договор в долларах. Это важно:
    при ввозе из ЕАЭС НДС платим не на таможне, а в налоговую — сами, по заявлению о ввозе. А с июня 2026
    года при автоперевозке добавляется еще и СПОТ.'
  legal_note: 'Импорт из государств — членов ЕАЭС: косвенные налоги взимает налоговый орган страны-импортера
    (ст. 72 Договора о ЕАЭС, Протокол — прил. № 18). СПОТ — для ввоза автотранспортом (ст. 5 Закона №
    101-ФЗ; ФНС: иные виды транспорта — не ранее 2027 г.).'
