  narration: 'Заполняем товары: два компрессора на 10 000 долларов. Программа сама считает обеспечительный
    платеж: фактурную стоимость пересчитывает по курсу ЦБ на день, предшествующий дате ДОПП, — у нас учебный
    курс 92 рубля, — и берет 22%. Получаем 202 400 рублей. Обратите внимание: это предварительная сумма.
    Окончательный НДС посчитаем по курсу на дату принятия товара к учету, и суммы почти всегда разойдутся.'
