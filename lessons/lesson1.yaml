- id: '14'
  title: Покупки → Поступление доп. расходов → Создать (или Поступление товаров → «Создать на основании»
    → «Поступление доп. расходов»)
  narration: Доставку до границы оказал перевозчик «Магистраль-Логистика» — 30 000 рублей. В бухучете
    включаем ее в себестоимость компрессоров документом «Поступление доп. расходов». А вот для НДС — внимание!
    В базу ввозного НДС из ЕАЭС входит цена сделки, которую мы платим поставщику по контракту. Если доставка
    включена в стоимость товаров по контракту — база 960 000. Если не включена, как при отдельном договоре
    с российским перевозчиком, — доставка базу не увеличивает, и база 930 000. Поэтому сначала открываем
    контракт и проверяем условие.
  legal_note: Затраты на доставку включаются в фактическую себестоимость запасов (ФСБУ 5/2019, п. 11).
    База НДС = стоимость приобретенных товаров = цена сделки, подлежащая уплате поставщику по условиям
    договора (п. 14 Протокола, прил. № 18). Транспортные расходы увеличивают базу, только если включены
    в стоимость товаров по контракту (комментарий проверки №1).
  menu_path: Покупки → Поступление доп. расходов → Создать (или Поступление товаров → «Создать на основании»
